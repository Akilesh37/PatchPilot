version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: patchpilot-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./patchpilot.db
      - MODEL_PROVIDER=mock
    volumes:
      - ./data_storage:/app/data_storage
      - ./patchpilot.db:/app/patchpilot.db

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: patchpilot-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
